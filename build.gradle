plugins { // Latest loom at https://modmuss50.me/fabric.html
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

base { archivesName = project.mod_id + "-" + project.minecraft_version }
version = project.mod_version + '-' + project.minecraft_version
group = project.maven_group

repositories {
    mavenLocal()
    maven {
        description = "Maven for Cardinal Components and Player Ability Lib"
        url = "https://maven.ladysnake.org/releases/"
    }
    maven {
        description = "Maven for ModMenu"
        url = "https://maven.terraformersmc.com/releases/"
    }
    maven {
        description = "Maven for Datasync"
        url = "https://maven.uuid.gg/releases/"
    }
}

dependencies {
    minecraft ("com.mojang:minecraft:${project.minecraft_version}")
    implementation ("net.fabricmc:fabric-loader:${project.loader_version}")
    implementation ("net.fabricmc.fabric-api:fabric-api:${project.fabric_version}")
    implementation ("com.terraformersmc:modmenu:${project.modmenu_version}")
}

loom {
    accessWidenerPath = file("src/main/resources/mialib.accesswidener")
}

fabricApi {
    configureDataGeneration() {
        modId = "mialib"
        client = true
    }
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
jar {
    inputs.property "projectName", project.name
    from("LICENSE.md") { rename { "${it}_${project.name}"} }
}

publishing {
    publications { create("mavenJava", MavenPublication) { from components.java } }
    repositories {
        maven {
            name = "willBlRepositoryReleases"
            url = "https://maven.willbl.dev/releases"
            credentials(PasswordCredentials)
            authentication { basic(BasicAuthentication) }
        }
    }
}